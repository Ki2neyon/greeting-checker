<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body id="message">
    <header>
        <h1>Greeting App</h1>
        <p>Practice JavaScript Input</p>
    </header>

    <main>
        <div class="card">
            <h2>Enter Your Name</h2>
            <input type="text" placeholder="Your name" id="name"><br>
            <button id="greet-button">Greet</button>
            <p id="greeting">Your greeting will appear here.</p>
        </div>
    </main>
</body>
</html>
